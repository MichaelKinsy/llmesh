services:
  bitnet-server:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - MODELS_DIR=/app/models
      - CPU_THREADS=4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
